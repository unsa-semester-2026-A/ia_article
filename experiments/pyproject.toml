[build-system]
requires = ["setuptools==70.0.0", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments"
version = "0.1.0"
description = "Research project for vehicle detection and inpainting in drone imagery (SMART Challenge 2026)"
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "MIT"}
authors = [
    {name = "Alvaro", email = "alvaro@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy==1.26.4",
    "opencv-python",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
cloud = [
    "ultralytics==8.4.103",
    "lap==0.5.13",
    "pytest",
    "pytest-cov",
    "albumentations",
    "wandb",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]
local = [
    "ultralytics==8.4.103",
    "lap==0.5.13",
    "torch",
    "torchvision",
    "pytest",
    "pytest-cov",
    "albumentations",
    "wandb",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "pyright==1.1.350",
    "ruff==0.15.14",
    "httpx==0.27.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-branch"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingParameterType = true
reportUnknownParameterType = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["D"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
