# Configuration for Base 1 (Data Cruda)
# Minimal augmentation: Standard YOLO mosaic/mixup/copy_paste/erasing are disabled.

# Model & Core Parameters
model: yolo26s-obb.pt
imgsz: 640
epochs: 100
patience: 20
batch: 16
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
seed: 42
device: 0

# Optimization/Loss Weighting
box: 7.5
cls: 0.5
dfl: 1.5

# Geometric Augmentations (Common to all conditions)
fliplr: 0.5
flipud: 0.5
degrees: 180.0
scale: 0.5
translate: 0.1

# Specific Augmentation Reductions (Minimal Augmentation)
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
erasing: 0.0

# Conservative HSV parameters
hsv_h: 0.015
hsv_s: 0.3
hsv_v: 0.2
